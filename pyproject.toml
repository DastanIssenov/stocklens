# Research workspace: data_pipeline/ and ml/ (CPU now, GPU later). The website backend has its own
# project in backend/pyproject.toml.
[project]
name = "stock-platform-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "python-dotenv>=1.2",
    "pyyaml>=6.0",
    "numpy>=2",
    "pandas>=3.0",
    "pyarrow>=20",
    "yfinance>=1.7",
    "scikit-learn>=1.9",
    "lightgbm>=4.7",
    "xgboost>=3.4",
    "mlflow>=3.17",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=9.2", "ruff>=0.17"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
include = ["data_pipeline/**/*.py", "ml/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # formatter wraps code; long strings are fine

[tool.pytest.ini_options]
testpaths = ["data_pipeline/tests", "ml/tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
