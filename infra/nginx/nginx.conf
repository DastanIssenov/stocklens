# Single origin for the whole site: / → Next.js, /api /ws /health /docs → FastAPI.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

# Resolve service names at request time via Docker's embedded DNS. Static `upstream` blocks are resolved once at
# startup, so after `make up` recreates frontend/backend (new container IP) nginx kept proxying to the dead IP → 502.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  server_name _;
  client_max_body_size 1m;
  server_tokens off;

  # proxy_pass with a variable forces per-request DNS lookup (URI is still passed through unchanged)
  set $backend  http://backend:8000;
  set $frontend http://frontend:3000;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_set_header Host $host;
  # overwrite (not append) so clients cannot spoof the IP used for rate limiting
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;

  location /api/ {
    proxy_pass $backend;
    proxy_read_timeout 90s;
  }

  location = /health { proxy_pass $backend; }
  location = /openapi.json { proxy_pass $backend; }
  location /docs { proxy_pass $backend; }

  location /ws/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass $frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
