# Single origin for the whole site: / → Next.js, /api /ws /health /docs → FastAPI.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream backend  { server backend:8000; }
upstream frontend { server frontend:3000; }

server {
  listen 80;
  server_name _;
  client_max_body_size 1m;
  server_tokens off;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  proxy_set_header Host $host;
  # overwrite (not append) so clients cannot spoof the IP used for rate limiting
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-Id $request_id;

  location /api/ {
    proxy_pass http://backend;
    proxy_read_timeout 90s;
  }

  location = /health { proxy_pass http://backend; }
  location = /openapi.json { proxy_pass http://backend; }
  location /docs { proxy_pass http://backend; }

  location /ws/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
  }

  location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
  }
}
