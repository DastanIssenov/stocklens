# Short-term (5-day) model v2 on CPU. Run: python -m ml.train --config ml/configs/short_gbm.yaml
# Every choice below was made on the 2016–2018 dev folds by `python -m ml.experiments.ablation`
# (docs/ABLATION_DEV.md); the 2019–2026 test folds are evaluated once with this file.
name: short_gbm_cpu_v2
horizon: 5                 # trading days
target: xup                # label = stock beats the day's median 5-day return (ranking, not market timing)
features:                  # v1 + cross-sectional ranks; hy_spread dropped (FRED serves it only from 2023-10)
  base: v1
  add: [ranks]
  drop: [hy_spread]
data:
  lake: data/lake          # Parquet lake from `python -m data_pipeline backfill`
  prices: prices_us
  start: "2010-01-01"
  min_history_days: 252
validation:
  test_years: [2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  embargo_days: 5          # extra gap after purging horizon days
models:
  baseline_persistence: {}
  baseline_momentum: {}
  logreg: {C: 0.1}
  lightgbm: {n_estimators: 400, learning_rate: 0.03, num_leaves: 31, min_child_samples: 200}
  xgboost: {n_estimators: 400, learning_rate: 0.03, max_depth: 5, min_child_weight: 50}
ensemble: [lightgbm, xgboost]   # mean probability of the two
backtest:
  top_quantile: 0.1        # buy the top 10 % by (smoothed) score …
  hold_quantile: 0.3       # … and keep a name while it stays in the top 30 % (hysteresis, less churn)
  smooth_span: 3           # EMA of each stock's score over its last sessions before ranking
  rebalance_days: 5
  cost_bps: 10
mlflow:
  tracking_uri: sqlite:///mlruns/mlflow.db
  experiment: short_term_gbm
export:
  model: ensemble          # lightgbm | xgboost | ensemble
  dir: ml/artifacts/short_gbm
