[project]
name = "stock-platform-backend"
version = "0.1.0"
description = "Stock prediction platform (US + Kazakhstan) — educational project, not investment advice"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162,<1",
    "uvicorn[standard]>=0.54",
    "pydantic[email]>=2.14,<3",
    "pydantic-settings>=2.16",
    "sqlalchemy[asyncio]>=2.0,<2.2",
    "asyncpg>=0.32",
    "alembic>=1.20",
    "pgvector>=0.5",
    "structlog>=26.1",
    "redis>=8.1",
    "celery>=5.6",
    "argon2-cffi>=25.1",
    "pyjwt>=2.15",
    "httpx>=0.28",
    "feedparser>=6.0.14",
    "yfinance>=1.7",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "respx>=0.23",
    "ruff>=0.17",
    "mypy>=2.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI Depends() in defaults
    "RUF001", "RUF002", "RUF003",  # Cyrillic text in strings/comments is intentional
    "S311",   # random is used for demo data, not crypto
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S107", "E501"]  # long literal test fixtures are fine

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
concurrency = ["thread", "greenlet"]
omit = ["app/db/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
